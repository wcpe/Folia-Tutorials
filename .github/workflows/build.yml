#       env:
#         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#       with:
#         upload_url: ${{ steps.create-new-release.outputs.upload_url }}
#         asset_path: Banker-Wiki-English.pdf
#         asset_name: Banker-Wiki-English.pdf
